const $=s=>document.querySelector(s), canvas=$('#world'),ctx=canvas.getContext('2d'),mini=$('#minimap'),mctx=mini.getContext('2d');let state={screen:'intro',country:null,character:'Lucia',x:0,y:0,angle:0,vehicle:null,speed:0,health:87,camera:2,lights:{house:[false,false,false]},fine:250,arrested:false,weather:'CLEAR',rain:[],dialogue:0,walkers:[],traffic:[],last:0};
function overlay(html,wide=false){$('#overlay').innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;$('#overlay').style.display='grid'}function closeOverlay(){ $('#overlay').style.display='none'}
function startIntro(){state.screen='intro';overlay(`<div class="intro-logo">✦ &nbsp; FIVE STAR GAMES</div><div class="intro-title">The city is<br>yours<span>.</span></div><p class="intro-copy">A small open-world night is waiting. Pick your region, find your keys, and make the streets your own.</p><div class="eyebrow" style="margin-top:24px">GTA 6 LITE · A CITY STORIES EXPERIENCE</div><div class="btn-row"><span class="fineprint">A Five Star Games original<br>One city. Your own rules.</span><button class="btn" id="introContinue">BEGIN</button></div>`);$('#introContinue').onclick=showVerify}
function showVerify(){state.screen='verify';overlay(`<div class="intro-logo">FIVE STAR GAMES · PLAYER CHECK</div><h2 style="font-size:25px;margin-top:18px">Before you enter</h2><p>Confirm you are 18 or older. Your date of birth is checked only in this browser and is not stored or sent.</p><div class="option"><div class="option-title">01 &nbsp; EMAIL + DATE OF BIRTH</div><div class="option-desc">Email is optional and is never collected by this demo.</div><label class="field-label">Email (optional)</label><input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email"><label class="field-label">Date of birth</label><div class="date-grid"><input class="input" id="day1" placeholder="Day" inputmode="numeric" maxlength="2"><select class="input" id="month1"><option value="">Month</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">${new Date(2000,i,1).toLocaleString('en',{month:'long'})}</option>`).join('')}</select><input class="input" id="year1" placeholder="Year" inputmode="numeric" maxlength="4"></div><button class="btn" style="width:100%;margin-top:12px" id="verifyEmail">CONTINUE</button></div><div class="option black"><div class="option-title">02 &nbsp; SKIP EMAIL</div><div class="option-desc">Enter only your date of birth to continue.</div><div class="date-grid" style="margin-top:12px"><input class="input" id="day2" placeholder="Day" inputmode="numeric" maxlength="2"><select class="input" id="month2"><option value="">Month</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">${new Date(2000,i,1).toLocaleString('en',{month:'short'})}</option>`).join('')}</select><input class="input" id="year2" placeholder="Year" inputmode="numeric" maxlength="4"></div><button class="btn secondary" style="width:100%;margin-top:12px" id="verifySkip">CONTINUE WITHOUT EMAIL</button></div>`);$('#verifyEmail').onclick=()=>verifyAge('1');$('#verifySkip').onclick=()=>verifyAge('2')}
function verifyAge(n){let d=+$(`#day${n}`).value,m=+$(`#month${n}`).value,y=+$(`#year${n}`).value, dob=new Date(y,m-1,d),now=new Date(),valid=d>0&&d<=31&&m>0&&y>1900&&dob.getDate()===d&&dob.getMonth()===m-1&&dob.getFullYear()===y;if(!valid)return toast('Enter a valid day, month, and year.');let age=now.getFullYear()-y-(now.getMonth()<m-1||now.getMonth()===m-1&&now.getDate()<d?1:0);if(age<18){state.screen='blocked';$('#overlay').innerHTML=`<div class="warning"><div><div style="font-size:12px;letter-spacing:.3em;font-weight:800">FIVE STAR GAMES</div><h1>ACCESS DENIED</h1><p>This experience is restricted to players 18 and older.</p></div></div>`;$('#overlay').classList.add('danger');return}showLoading()}

function showCountries(){state.screen='country';overlay(`<div class="intro-logo">FIVE STAR GAMES · REGION SELECT</div><h2 style="font-size:27px;margin-top:12px">Choose your city</h2><p>Each region has its own safehouse, street voices, and local identity. Regions are fixed to their real-world city.</p><div class="country-grid">${countries.map((c,i)=>`<button class="country" data-country="${i}"><span class="flag">${c.flag}</span><strong>${c.name}</strong><small>${c.city.toUpperCase()} · ${c.lang.toUpperCase()}</small></button>`).join('')}</div>`);document.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>enterCountry(+b.dataset.country))}
function enterCountry(i){state.country=countries[i];state.screen='game';state.x=120;state.y=105;state.character='Lucia';state.vehicle=null;state.walkers=[];for(let n=0;n<16;n++)state.walkers.push({x:Math.random()*1800-900,y:Math.random()*1800-900,a:Math.random()*Math.PI*2,c:['#dfb787','#db8d79','#8fc7ad'][n%3],t:Math.random()*8});for(let n=0;n<10;n++)state.traffic.push({x:Math.random()*2000-1000,y:Math.random()*2000-1000,a:Math.random()*6.28,c:['#e78062','#c6ce91','#7899ad'][n%3],s:40+Math.random()*25});$('#location').textContent=`${state.country.city.toUpperCase()} · ${state.country.home.toUpperCase()}`;$('#miniRegion').textContent=state.country.city.toUpperCase();$('#hud').style.display='block';closeOverlay();updateWeather();toast(state.country.hello);lastTime();draw()}

async function updateWeather(){let c=state.country;if(!c)return;try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`);let j=await r.json(),code=j.current.weather_code;state.weather=(code===0?'CLEAR':code<50?'CLOUDY':code<70?'RAIN':'STORM');$('#weather').innerHTML=`${code<50?'◌':code<70?'☂':'ϟ'} &nbsp; ${state.weather} · ${Math.round(j.current.temperature_2m)}°C`}catch(e){let h=new Date().getHours();state.weather=h>17||h<6?'NIGHT':'CLEAR';$('#weather').innerHTML=`◌ &nbsp; ${state.weather} · LOCAL SKY`}}

function resize(){let dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);mini.width=mini.clientWidth*dpr;mini.height=mini.clientHeight*dpr;mctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
const buildings=[];for(let gx=-1800;gx<1900;gx+=360)for(let gy=-1800;gy<1900;gy+=360){let seed=Math.abs(Math.sin(gx*12.3+gy*5.7)),kind=seed<.12?'park':seed>.85?'shop':'block';buildings.push({x:gx+26,y:gy+26,w:308,h:308,kind,seed})}

function drawWorld(){let w=canvas.clientWidth,h=canvas.clientHeight,zoom=state.camera===0?1.55:state.camera===3?.62:state.camera===4?.82:state.camera===2?.9:1;let cx=state.x,cy=state.y;if(state.camera===3){cx+=Math.cos(state.angle)*190;cy+=Math.sin(state.angle)*190}let sc=zoom;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2);ctx.scale(sc,sc);ctx.translate(-cx,-cy);let night=state.publicLights;
ctx.fillStyle=night?'#192522':'#253b32';ctx.fillRect(cx-w/(2*sc)-100,cy-h/(2*sc)-100,w/sc+200,h/sc+200);

for(let x=-2200;x<2200;x+=360){ctx.fillStyle='#414b48';ctx.fillRect(x-16,-2200,32,4400);ctx.fillStyle='#54605a';ctx.fillRect(x-20,-2200,4,4400);ctx.fillRect(x+16,-2200,4,4400);ctx.strokeStyle='#b9b69a55';ctx.setLineDash([18,19]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x, -2200);ctx.lineTo(x,2200);ctx.stroke();ctx.setLineDash([])}
for(let y=-2200;y<2200;y+=360){ctx.fillStyle='#414b48';ctx.fillRect(-2200,y-16,4400,32);ctx.fillStyle='#54605a';ctx.fillRect(-2200,y-20,4400,4);ctx.fillRect(-2200,y+16,4400,4);ctx.strokeStyle='#b9b69a55';ctx.setLineDash([18,19]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-2200,y);ctx.lineTo(2200,y);ctx.stroke();ctx.setLineDash([])}
for(const b of buildings){if(Math.abs(b.x-cx)>w/sc/2+400||Math.abs(b.y-cy)>h/sc/2+400)continue;if(b.kind==='park'){ctx.fillStyle='#385845';ctx.fillRect(b.x,b.y,b.w,b.h);for(let n=0;n<16;n++){let tx=b.x+20+(n*47%270),ty=b.y+18+(n*73%270);ctx.fillStyle='#67835a';ctx.beginPath();ctx.arc(tx,ty,7+(n%3),0,7);ctx.fill();ctx.fillStyle='#997453';ctx.fillRect(tx-1,ty+3,2,9)}}else{ctx.fillStyle='#888b7966';ctx.fillRect(b.x-6,b.y-6,b.w+12,b.h+12);let pad=state.country?.city==='Karachi'?'#9b795d':state.country?.city==='Miami'?'#a98c78':'#95897b';ctx.fillStyle=pad;ctx.fillRect(b.x,b.y,b.w,b.h);let inset=b.kind==='shop'?20:30;ctx.fillStyle=b.kind==='shop'?'#54544a':(b.seed>.5?'#766e61':'#666b61');ctx.fillRect(b.x+inset,b.y+inset,b.w-inset*2,b.h-inset*2);ctx.fillStyle='#d2bc9a';for(let ix=0;ix<3;ix++)for(let iy=0;iy<3;iy++){ctx.fillRect(b.x+inset+15+ix*74,b.y+inset+14+iy*75,22,12)}if(night){ctx.fillStyle='#f8c96c';ctx.globalAlpha=.55;ctx.fillRect(b.x+inset+15,b.y+inset+14,22,12);ctx.globalAlpha=1}if(b.kind==='shop'){ctx.fillStyle='#ed7c69';ctx.fillRect(b.x+105,b.y+8,95,9)}}}

function drawEntity(x,y,a,color,isCar=false){ctx.save();ctx.translate(x,y);ctx.rotate(a);if(isCar){ctx.fillStyle='#101615';roundRect(ctx,-19,-10,38,20,5,true);ctx.fillStyle=color;roundRect(ctx,-16,-8,32,16,4,true);ctx.fillStyle='#30423d';roundRect(ctx,-7,-6,15,12,3,true);ctx.fillStyle='#f5df99';ctx.fillRect(13,-6,3,4);ctx.fillRect(13,2,3,4)}else{ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,-2,5,0,7);ctx.fill();ctx.fillStyle='#e7c2a4';ctx.beginPath();ctx.arc(0,-6,3,0,7);ctx.fill()}ctx.restore()}
function drawPlayer(){let w=canvas.clientWidth,h=canvas.clientHeight,scale=state.camera===0?1.55:state.camera===3?.62:state.camera===4?.82:state.camera===2?.9:1, p=worldToScreen(state.x,state.y,state.x,state.y,scale,w,h);if(state.camera===1){ctx.fillStyle='#192522';ctx.fillRect(0,0,w,h);ctx.fillStyle='#263a33';ctx.beginPath();ctx.moveTo(w*.17,h);ctx.lineTo(w*.36,h*.45);ctx.lineTo(w*.64,h*.45);ctx.lineTo(w*.83,h);ctx.fill();ctx.fillStyle='#46504b';ctx.fillRect(w*.45,h*.48,w*.1,h*.28);ctx.fillStyle='#e4c283';ctx.fillRect(w*.48,h*.52,w*.04,h*.04);ctx.fillStyle='#ddd';ctx.font='10px DM Mono';ctx.fillText('FIRST PERSON · PRESS C TO CHANGE CAMERA',20,h-24);return}for(let v of state.traffic){let p2=worldToScreen(v.x,v.y,state.x,state.y,scale,w,h);if(p2.x>-60&&p2.x<w+60&&p2.y>-60&&p2.y<h+60)drawEntity(p2.x,p2.y,v.a,v.c,true)}for(let npc of state.walkers){let p2=worldToScreen(npc.x,npc.y,state.x,state.y,scale,w,h);if(p2.x>-30&&p2.x<w+30&&p2.y>-30&&p2.y<h+30)drawEntity(p2.x,p2.y,npc.a,npc.c)}if(state.vehicle){drawEntity(p.x,p.y,state.angle,state.vehicle.color,true)}else drawEntity(p.x,p.y,state.angle,state.character==='Lucia'?'#e98489':'#8cb9a5')}
const places=[{id:'home',name:'SAFEHOUSE',x:120,y:105,icon:'⌂'},{id:'showroom',name:'MOTOR CLUB',x:440,y:40,icon:'◈'},{id:'hospital',name:'HOSPITAL',x:-370,y:365,icon:'✚'},{id:'police',name:'POLICE STATION',x:-370,y:-360,icon:'▣'}];
function drawMarkers(){let w=canvas.clientWidth,h=canvas.clientHeight,sc=state.camera===0?1.55:state.camera===3?.62:state.camera===2?.9:1;for(let p of places){let q=worldToScreen(p.x,p.y,state.x,state.y,sc,w,h);if(q.x<-80||q.x>w+80||q.y<-80||q.y>h+80)continue;ctx.fillStyle='rgba(12,18,18,.8)';roundRect(ctx,q.x-37,q.y-37,74,22,5,true);ctx.fillStyle=p.id==='home'?'#d2f66d':'#fff';ctx.font='10px DM Mono';ctx.textAlign='center';ctx.fillText(`${p.icon} ${p.name}`,q.x,q.y-22);ctx.textAlign='left';if(p.id==='home'){ctx.fillStyle='#ff74ba';ctx.beginPath();ctx.arc(q.x,q.y,4,0,7);ctx.fill()}}}
function drawMini(){let w=mini.clientWidth,h=mini.clientHeight,scale=.13;mctx.clearRect(0,0,w,h);mctx.fillStyle='#111a18';mctx.fillRect(0,0,w,h);mctx.save();mctx.translate(w/2-state.x*scale,h/2-state.y*scale);mctx.fillStyle='#48524e';for(let x=-2200;x<2200;x+=360)mctx.fillRect(x-9,-2200,18,4400);for(let y=-2200;y<2200;y+=360)mctx.fillRect(-2200,y-9,4400,18);mctx.fillStyle='#d2f66d';for(let p of places){mctx.beginPath();mctx.arc(p.x,p.y,5,0,7);mctx.fill()}mctx.strokeStyle='#ff74ba';mctx.lineWidth=3;mctx.beginPath();mctx.moveTo(state.x,state.y);mctx.lineTo(places[1].x,places[1].y);mctx.stroke();mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(state.x,state.y,4,0,7);mctx.fill();mctx.restore()}
function draw(){if(state.screen!=='game')return;drawWorld();drawPlayer();drawMarkers();drawMini();requestAnimationFrame(draw)}
let keys={},then=0;function frame(ts){requestAnimationFrame(frame);if(state.screen!=='game')return;let dt=Math.min(.05,(ts-then)/1000||0);then=ts;let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(state.vehicle){if(forward)state.speed=Math.max(-20,Math.min(150,state.speed+forward*48*dt));else state.speed*=Math.max(0,1-1.6*dt);if(side)state.angle+=side*dt*(state.speed<0?-1:1)*1.8;let v=state.speed/3.6;state.x+=Math.cos(state.angle)*v*dt;state.y+=Math.sin(state.angle)*v*dt;$('#speedVal').textContent=Math.round(Math.abs(state.speed));$('#speedBox').style.display='block';$('#activeRole').textContent=`${state.vehicle.name.toUpperCase()} · ${Math.round(state.speed)} KM/H`}else{let mag=Math.hypot(forward,side);if(mag){let vx=side*Math.cos(state.angle)-forward*Math.sin(state.angle),vy=side*Math.sin(state.angle)+forward*Math.cos(state.angle);state.x+=vx/mag*125*dt;state.y+=vy/mag*125*dt;state.angle=Math.atan2(vy,vx)}$('#speedBox').style.display='none';$('#activeRole').textContent=state.country.city.toUpperCase()+' · ON FOOT'}for(let n of state.walkers){n.t+=dt;if(n.t>2){n.t=0;n.a+=(Math.random()-.5)*1.6}n.x+=Math.cos(n.a)*12*dt;n.y+=Math.sin(n.a)*12*dt}updateTime();showInteractionPrompt()}
function closestPlace(){let found=null,d=Infinity;for(let p of places){let a=Math.hypot(state.x-p.x,state.y-p.y);if(a<d){d=a;found=p}}return d<95?found:null}
function interaction(){let p=closestPlace();if(state.vehicle){state.vehicle=null;state.speed=0;toast('Parked. You step out onto the street.');return}if(!p){let npc=state.walkers.find(n=>Math.hypot(n.x-state.x,n.y-state.y)<70);if(npc){toast(state.country.hello);return}toast('Nothing nearby. Follow the pink route to the Motor Club.');return}if(p.id==='home')houseMenu();if(p.id==='showroom')showroomMenu();if(p.id==='hospital')hospitalMenu();if(p.id==='police')policeMenu()}
function houseMenu(){overlay(`<div class="modal-head"><div><div class="eyebrow">${state.country.home.toUpperCase()}</div><h2>Home, your way.</h2><p>Public lights follow local time: on at 18:00 and off at 07:00. Your home is always yours to control.</p></div><button class="close" id="close">×</button></div><div class="menu-grid">${['Interior lights','Kitchen appliances','Bedroom lamp'].map((n,i)=>`<button class="menu-item" data-light="${i}"><b>${state.lights.house[i]?'● ON':'○ OFF'} &nbsp; ${n}</b><span>Manual safehouse switch · tap to toggle</span></button>`).join('')}</div><div class="btn-row"><span class="fineprint">Switches work independently of city lighting.</span><button class="btn secondary" id="homeClose">BACK TO STREET</button></div>`);$('#close').onclick=closeOverlay;$('#homeClose').onclick=closeOverlay;document.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>{state.lights.house[+b.dataset.light]=!state.lights.house[+b.dataset.light];houseMenu()})}
const cars=[{name:'Prism GT',desc:'Blue-to-pink fade · supercar',color:'#b47cbd',price:'$98,000',emoji:'✧'},{name:'C8 Fieldline',desc:'Camouflage · mid-engine coupe',color:'#87916d',price:'$76,500',emoji:'◈'},{name:'Orange Track',desc:'Track hypercar · launch control',color:'#ed8e45',price:'$142,000',emoji:'⌁'},{name:'Classic Verde',desc:'Green lowrider · chrome trim',color:'#579378',price:'$42,000',emoji:'◇'},{name:'Skyline E',desc:'Civilian flying Tesla · hover mode',color:'#b7d8d1',price:'$120,000',emoji:'✦'},{name:'Interceptor Air',desc:'Police flying Tesla · patrol livery',color:'#e4e6df',price:'—',emoji:'✚'}];
function showroomMenu(){overlay(`<div class="modal-head"><div><div class="eyebrow">MOTOR CLUB · SHOWROOM</div><h2>Pick your next ride.</h2><p>Choose any ride to take it for a test drive. The interceptor is an aerial patrol ride.</p></div><button class="close" id="close">×</button></div><div class="menu-grid">${cars.map((c,i)=>`<button class="menu-item" data-car="${i}"><b style="color:${c.color}">${c.emoji} &nbsp; ${c.name}</b><span>${c.desc}<br>${c.price} · Take for a spin</span></button>`).join('')}</div>`,true);$('#close').onclick=closeOverlay;document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{state.vehicle={...cars[+b.dataset.car]};state.x=440;state.y=40;state.speed=0;state.angle=0;closeOverlay();toast(`${state.vehicle.name} ready. WASD to drive · E to park.`)})}
function hospitalMenu(){overlay(`<div class="modal-head"><div><div class="eyebrow">${state.country.city.toUpperCase()} GENERAL · TRIAGE</div><h2>Let's get you back on your feet.</h2><p>Patient gown, an IV drip and a quick checkup. Fee: $750. We'll patch you up, no questions asked.</p></div><button class="close" id="close">×</button></div><div class="menu-item" style="margin-top:16px"><b>✚ &nbsp; URGENT CARE</b><span>Health ${state.health}% → 100% · Patient clothes · IV fluids<br>Balance: $${state.cash||18420}</span></div><div class="btn-row"><span class="fineprint">Medical fee is deducted from your game wallet.</span><button class="btn" id="heal">PAY $750 · TREAT ME</button></div>`);$('#close').onclick=closeOverlay;$('#heal').onclick=()=>{if((state.cash||18420)<750)return toast('Not enough cash for treatment.');state.cash=(state.cash||18420)-750;state.health=100;$('#healthNum').textContent='100%';$('#healthFill').style.width='100%';closeOverlay();toast('Treatment complete. IV drip removed. Health restored.')}}
function policeMenu(){overlay(`<div class="modal-head"><div><div class="eyebrow">${state.country.city.toUpperCase()} · DISTRICT POLICE</div><h2>${state.arrested?'Processing desk':'Community desk'}</h2><p>${state.arrested?'You are in the holding area. Choose to pay your fine or wait out your sentence.':'Inmate uniforms are issued in holding. Check in here to settle a city citation.'}</p></div><button class="close" id="close">×</button></div><div class="menu-item" style="margin-top:16px"><b>▣ &nbsp; CITATION · $${state.fine}</b><span>Pay your fine now or choose the 3-hour hold option.</span></div><div class="btn-row"><button class="btn secondary" id="wait">WAIT 3 HOURS</button><button class="btn" id="pay">PAY FINE · $${state.fine}</button></div><p style="margin-top:18px">Voice option: say <b>“Pay fine”</b> while this desk is open.</p>`);$('#close').onclick=closeOverlay;$('#pay').onclick=payFine;$('#wait').onclick=()=>{let d=new Date();d.setHours(d.getHours()+3);state.timeOffset=(state.timeOffset||0)+10800000;state.arrested=false;closeOverlay();toast('Three hours pass. You are released in fresh inmate clothes.')};startVoice()}

let voiceRec=null;function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{voiceRec=new SR();voiceRec.lang='en-US';voiceRec.onresult=e=>{if(e.results[0][0].transcript.toLowerCase().includes('pay fine'))payFine()};voiceRec.start()}catch(e){}}

function enterCountry(i){state.country=countries[i];state.screen='game';state.x=120;state.y=105;state.character='Lucia';state.vehicle=null;state.walkers=[];state.traffic=[];for(let n=0;n<16;n++)state.walkers.push({x:Math.random()*1800-900,y:Math.random()*1800-900,a:Math.random()*6.28,c:['#dfb787','#db8d79','#8fc7ad'][n%3],t:Math.random()*8});for(let n=0;n<10;n++)state.traffic.push({x:Math.random()*2000-1000,y:Math.random()*2000-1000,a:Math.random()*6.28,c:['#e78062','#c6ce91','#7899ad'][n%3],s:40+Math.random()*25});$('#location').textContent=`${state.country.city.toUpperCase()} · ${state.country.home.toUpperCase()}`;$('#miniRegion').textContent=state.country.city.toUpperCase();$('#hud').style.display='block';closeOverlay();updateWeather();updateTime();toast(state.country.hello);draw()}
function showInteractionPrompt(){let p=closestPlace();$('#prompt').innerHTML=p?`<span class="key">E</span> ${p.name} · interact<br><span class="key">C</span> camera &nbsp; <span class="key">P</span> phone`:`Explore the neighborhood<br><span class="key">W A S D</span> move &nbsp; <span class="key">E</span> interact &nbsp; <span class="key">C</span> camera`}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(state.screen!=='game')return;keys[e.code]=true;if(e.repeat)return;if(e.code==='KeyE')interaction();if(e.code==='KeyC')cycleCamera();if(e.code==='KeyF')switchCharacter(state.character==='Lucia'?'Jason':'Lucia');if(e.code==='KeyP')phoneMenu();if(e.code==='KeyL'&&closestPlace()?.id==='home'){state.lights.house[0]=!state.lights.house[0];toast(`Safehouse interior lights ${state.lights.house[0]?'on':'off'}.`)}});document.addEventListener('keyup',e=>keys[e.code]=false);$('#switchL').onclick=()=>switchCharacter('Lucia');$('#switchJ').onclick=()=>switchCharacter('Jason');document.querySelectorAll('[data-dir]').forEach(b=>{let codes={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},code=codes[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[code]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[code]=false))});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.country)updateWeather()});
const cameraNames=['CINEMATIC','FIRST PERSON','THIRD PERSON','DRONE / AERIAL','DIRECTOR'];function cycleCamera(){state.camera=(state.camera+1)%5;toast(`Camera · ${cameraNames[state.camera]}`)}function switchCharacter(name){if(state.character===name)return;state.character=name;$('#activeName').textContent=name.toUpperCase();$('#activeAvatar').textContent=name[0];$('#activeAvatar').className='avatar'+(name==='Jason'?' jason':'');$('#switchL').classList.toggle('active',name==='Lucia');$('#switchJ').classList.toggle('active',name==='Jason');toast(`${name} is now active · ${name==='Lucia'?'Realme 5':'Infinix Smart 9'} ready.`)}
